<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentWatch Menu Bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#050505}
button{font-family:inherit}
button:focus-visible{outline:2px solid #ededed;outline-offset:2px}
</style>
</helmet>
<div style="width: 380px; height: 640px; box-sizing: border-box; padding: 0 12px 12px; background: radial-gradient(900px 420px at 88% -8%, #111111, #050505 70%), #050505; font-family: 'Geist', system-ui, sans-serif; font-size: 13px; line-height: 1.4; color: #ededed; display: flex; flex-direction: column; align-items: stretch">

<div style="height: 18px; display: flex; justify-content: flex-end; padding-right: 22px; align-items: flex-end">
<div style="width: 14px; height: 14px; background: #0b0b0b; border-top: 1px solid #303030; border-left: 1px solid #303030; transform: translateY(8px) rotate(45deg)"></div>
</div>

<div style="flex: 1; min-height: 0; background: #0b0b0b; border: 1px solid #303030; border-radius: 8px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; min-height: 48px; border-bottom: 1px solid #202020">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#f2f2f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8.25"/><path d="M3.5 10.5h3l1.8-4 3 7 1.7-3h3.5"/></svg>
<span style="font: 600 13px/1 'Geist Mono', ui-monospace, monospace; letter-spacing: 0.18em">AGENTWATCH</span>
</div>
<span style="display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1 'Geist Mono', ui-monospace, monospace"><span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(0.80 0.12 155)"></span>3 running</span>
</header>

<section aria-label="Needs you" style="margin: 12px 12px 0; padding: 12px 14px; background: #15140c; border: 1px solid oklch(0.82 0.11 85); border-radius: 4px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font: 500 11.5px/1 Geist, system-ui, sans-serif; letter-spacing: 0; color: oklch(0.82 0.11 85)">Needs you</span>
<span style="font: 400 11px/1 'Geist Mono', ui-monospace, monospace; color: #a3a3a3">waiting 02:14</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; font: 600 14px/1.2 'Geist', system-ui, sans-serif">
<span style="width: 7px; height: 7px; border-radius: 50%; background: #c8c8c8"></span>billing-web
<span style="font: 500 11px/1 'Geist Mono', ui-monospace, monospace; color: #c8c8c8">Codex</span>
</div>
<code style="display: block; padding: 8px 10px; background: radial-gradient(900px 420px at 88% -8%, #111111, #050505 70%), #050505; border: 1px solid #202020; border-radius: 4px; font: 500 12px/1.3 'Geist Mono', ui-monospace, monospace; overflow-wrap: anywhere">rm -rf dist &amp;&amp; pnpm build</code>
<a href="Session.dc.html" style="display: inline-flex; align-items: center; justify-content: center; height: 36px; border: 1px solid #ededed; border-radius: 4px; color: #ededed; text-decoration: none; font: 600 13px/1 'Geist', system-ui, sans-serif">Open session</a>
</section>

<section aria-label="Sessions" style="display: flex; flex-direction: column; padding: 12px 6px 0; flex: 1; min-height: 0">
<div style="padding: 0 10px 8px; font: 500 11.5px/1 Geist, system-ui, sans-serif; letter-spacing: 0; color: #858585">Sessions</div>
<sc-for list="{{sessions}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 7px; min-height: 64px; box-sizing: border-box; padding: 10px; border-bottom: 1px solid #181818">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="{{s.dotStyle}}"></span>
<span style="font: 600 14px/1.2 'Geist', system-ui, sans-serif">{{s.repo}}</span>
<sc-if value="{{s.hasFail}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border: 1px solid oklch(0.70 0.15 22); border-radius: 4px; font: 600 10px/1 'Geist Mono', ui-monospace, monospace; color: oklch(0.70 0.15 22)">✕ 1 failed</span>
</sc-if>
</span>
<span style="font: 400 11px/1 'Geist Mono', ui-monospace, monospace; color: #a3a3a3">{{s.elapsed}}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0">
<span style="font: 400 12px/1.3 'Geist Mono', ui-monospace, monospace; color: #a3a3a3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.action}}</span>
<span style="{{s.statusStyle}}">{{s.status}}</span>
</div>
</div>
</sc-for>
</section>

<footer style="padding: 12px; border-top: 1px solid #202020; display: flex; flex-direction: column; gap: 10px">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 4px; background: #f2f2f2; color: #050505; text-decoration: none; font: 600 13px/1 'Geist', system-ui, sans-serif">Open dashboard</a>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 400 11px/1 'Geist Mono', ui-monospace, monospace; color: #858585">
<span>local only · no telemetry</span>
<a href="#" style="color: #a3a3a3; display: inline-flex; align-items: center; min-height: 28px">Settings</a>
</div>
</footer>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const MONO = "'Geist Mono', ui-monospace, Menlo, monospace";
    const COL = { claude: '#ededed', codex: '#c8c8c8', generic: '#999999' };
    const ST = { run: 'oklch(0.80 0.12 155)', ask: 'oklch(0.82 0.11 85)', idle: '#a3a3a3' };
    const sessions = [
      { repo: 'auth-service', pk: 'claude', elapsed: '03:42', action: 'editing src/auth/session.ts', status: 'Running', st: 'run', hasFail: true },
      { repo: 'billing-web', pk: 'codex', elapsed: '12:08', action: 'waiting for approval', status: 'Needs you', st: 'ask', hasFail: false },
      { repo: 'notes-cli', pk: 'generic', elapsed: '41:15', action: 'idle · no output for 2m', status: 'Idle', st: 'idle', hasFail: false },
    ].map((s) => ({
      ...s,
      dotStyle: `flex:none;width:7px;height:7px;border-radius:50%;background:${COL[s.pk]}`,
      statusStyle: `flex:none;font: 500 11px/1 'Geist Mono', ui-monospace, monospace;letter-spacing:0.1em;text-transform:uppercase;text-transform:none;color:${ST[s.st]}`,
    }));
    return { sessions };
  }
}
</script>
</body>
</html>
